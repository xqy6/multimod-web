name: External Backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server backup
        run: |
          mkdir -p backups
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.BACKUP_TOKEN }}" \
            -o "backups/netdisk-$(date +%Y%m%d-%H%M%S).zip" \
            "${{ vars.BACKUP_SOURCE_URL || 'https://multimod-netdisk-production.up.railway.app/api/backup/full' }}"
          ls -lh backups

      - name: Upload to S3/R2
        run: |
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "BACKUP_S3_BUCKET not set, skip S3 upload"
            exit 0
          fi
          aws s3 cp backups/netdisk-*.zip "s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/$(date +%Y%m%d-%H%M%S)/"
        env:
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'netdisk' }}

      - name: Push to webhook
        run: |
          if [ -z "$BACKUP_WEBHOOK_URL" ]; then
            echo "BACKUP_WEBHOOK_URL not set, skip webhook push"
            exit 0
          fi
          for file in backups/*.zip; do
            curl -fsS --max-time 300 -F "backup=@$file" "$BACKUP_WEBHOOK_URL" || true
          done
        env:
          BACKUP_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: netdisk-backup-${{ github.run_id }}
          path: backups
          retention-days: 14
