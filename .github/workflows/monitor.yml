name: Health Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check health and alert on state change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEALTH_URL: ${{ vars.MONITOR_HEALTH_URL || 'https://multimod-netdisk-production.up.railway.app/api/health' }}
          WEBHOOK_URL: ${{ secrets.MONITOR_WEBHOOK_URL }}
        run: python scripts/health-monitor.py
